allprojects {
    group = 'de.isuret.polos.aopi'
    version = '3.0.0'

    repositories {
        mavenCentral()
    }
}

ext.gdxVersion = '1.14.2'

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(24)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
