plugins {
    id 'application'
}

dependencies {
    // Keep all LWJGL Java libraries and native binaries on a Java 24 compatible version.
    implementation platform('org.lwjgl:lwjgl-bom:3.3.6')
    implementation project(':core')
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation 'com.github.sarxos:webcam-capture:0.3.12'
    implementation 'com.fazecast:jSerialComm:2.11.0'
    implementation 'net.java.dev.jna:jna:5.14.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    runtimeOnly 'org.slf4j:slf4j-simple:1.7.36'
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    runtimeOnly "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-desktop"
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

application {
    mainClass = 'de.isuret.polos.aopi.desktop.DesktopLauncher'

    // Java 24 requires explicit native access for the desktop graphics libraries.
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']

    // GLFW must start on the first thread on macOS.
    if (System.getProperty('os.name').toLowerCase(java.util.Locale.ROOT).contains('mac')) {
        applicationDefaultJvmArgs += ['-XstartOnFirstThread']
    }
}

tasks.named('run', JavaExec) {
    // Give development runs a predictable, independent data directory.
    workingDir = rootProject.projectDir
}

// Use the existing Java/application plugins; no additional packaging plugin is needed.
def mergedServices = layout.buildDirectory.dir('fat-jar-services')
tasks.register('mergeRuntimeServices') {
    inputs.files(configurations.runtimeClasspath, sourceSets.main.output)
    outputs.dir(mergedServices)
    doLast {
        delete(mergedServices)
        def services = [:]
        def sources = [sourceSets.main.output.asFileTree] + configurations.runtimeClasspath.collect {
            it.isDirectory() ? fileTree(it) : zipTree(it)
        }
        sources.each { source ->
            source.matching { include 'META-INF/services/*' }.visit { entry ->
                if (!entry.directory) {
                    def name = entry.relativePath.pathString
                    def providers = services.computeIfAbsent(name) { new LinkedHashSet<String>() }
                    providers.addAll(entry.file.readLines('UTF-8').collect { it.replaceFirst(/#.*/, '').trim() }.findAll { it })
                }
            }
        }
        services.each { name, providers ->
            def target = mergedServices.get().file(name).asFile
            target.parentFile.mkdirs()
            target.setText(providers.join('\n') + '\n', 'UTF-8')
        }
    }
}

def registerFatJar = { String taskName, String fileName, List<String> nativeExcludes ->
    tasks.register(taskName, Jar) {
        group = 'distribution'
        description = 'Builds the executable AOPi JAR with runtime libraries, natives, and assets.'
        dependsOn tasks.named('mergeRuntimeServices')
        archiveFileName = fileName
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        manifest {
            attributes 'Main-Class': application.mainClass.get(),
                    'Implementation-Version': project.version.toString(),
                    'Enable-Native-Access': 'ALL-UNNAMED',
                    'Multi-Release': 'true'
        }
        from(sourceSets.main.output) { exclude 'META-INF/services/**' }
        from({ configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }) {
            exclude 'META-INF/services/**', 'META-INF/MANIFEST.MF', 'META-INF/INDEX.LIST',
                    'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/SIG-*', '**/module-info.class'
            exclude nativeExcludes
        }
        from(mergedServices)
    }
}

// Runtime dependencies already contain all three platforms, including Intel/ARM64 Mac natives.
registerFatJar('fatJar', 'AOPi.jar', [])
registerFatJar('windowsJar', 'AOPi-Windows.jar', ['**/*.so*', '**/*.dylib*', '**/*.jnilib*'])
registerFatJar('macJar', 'AOPi-Mac.jar', ['**/*.dll*', '**/*.so*'])
registerFatJar('linuxJar', 'AOPi-Linux.jar', ['**/*.dll*', '**/*.dylib*', '**/*.jnilib*'])
tasks.register('platformJars') {
    group = 'distribution'
    description = 'Builds separate portable Windows, Mac, and Linux JARs on any host OS.'
    dependsOn tasks.named('windowsJar'), tasks.named('macJar'), tasks.named('linuxJar')
}

// Explicit opt-in: this check opens real windows and needs a desktop with OpenGL.
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeTestImplementation.extendsFrom implementation
    smokeTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.register('portableJarSmokeTest', JavaExec) {
    dependsOn smokeTestClasses, tasks.named('windowsJar')
    classpath = sourceSets.smokeTest.runtimeClasspath
    mainClass = 'de.isuret.polos.aopi.desktop.PortableJarSmokeTest'
    args rootProject.layout.projectDirectory.file('dist/AOPi-Windows.jar').asFile.absolutePath
    workingDir = rootProject.projectDir
    jvmArgs application.applicationDefaultJvmArgs
}

